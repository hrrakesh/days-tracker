<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Difference Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(99, 102, 241, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.22), transparent 35%),
        #080b16;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    .card {
      background: rgba(17, 24, 39, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 38px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
    }

    h1 {
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -1.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 15px;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 25px;
    }

    .input-group label {
      display: block;
      margin-bottom: 9px;
      color: #d1d5db;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="date"] {
      width: 100%;
      height: 54px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
      transition: 0.25s;
      color-scheme: dark;
    }

    input[type="date"]:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .today-btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.08);
      color: #c7d2fe;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 25px;
      transition: 0.2s;
    }

    .today-btn:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    .result {
      border-radius: 22px;
      padding: 28px;
      background: linear-gradient(
        135deg,
        rgba(99, 102, 241, 0.13),
        rgba(168, 85, 247, 0.08)
      );
      border: 1px solid rgba(129, 140, 248, 0.18);
    }

    .direction {
      text-align: center;
      color: #a5b4fc;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 22px;
    }

    .main-result {
      text-align: center;
      margin-bottom: 28px;
    }

    .main-number {
      font-size: clamp(45px, 9vw, 76px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #fff, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main-label {
      color: #9ca3af;
      margin-top: 10px;
      font-size: 15px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .detail {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 18px 10px;
      text-align: center;
    }

    .detail-number {
      font-size: 24px;
      font-weight: 750;
      margin-bottom: 5px;
    }

    .detail-label {
      color: #9ca3af;
      font-size: 12px;
    }

    .calendar-result {
      text-align: center;
      margin-top: 22px;
      color: #d1d5db;
      font-size: 15px;
    }

    .calendar-result strong {
      color: #fff;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #6b7280;
      font-size: 12px;
    }

    @media (max-width: 650px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 24px 18px;
        border-radius: 22px;
      }

      .inputs {
        grid-template-columns: 1fr;
      }

      .details {
        grid-template-columns: repeat(2, 1fr);
      }

      .result {
        padding: 22px 15px;
      }
    }

    @media (max-width: 380px) {
      .details {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .detail {
        padding: 14px 6px;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <section class="card">

      <header class="header">
        <div class="icon">📅</div>
        <h1>Date Difference</h1>
        <p class="subtitle">
          Find exactly how long ago or how far in the future
        </p>
      </header>

      <div class="inputs">

        <div class="input-group">
          <label for="date1">Date to Compare</label>
          <input type="date" id="date1">
        </div>

        <div class="input-group">
          <label for="date2">Reference Date</label>
          <input type="date" id="date2">
        </div>

      </div>

      <button class="today-btn" id="todayBtn">
        ↻ Set Reference Date to Today
      </button>

      <div class="result">

        <div class="direction" id="direction">
          Select a date to calculate
        </div>

        <div class="main-result">
          <div class="main-number" id="mainNumber">—</div>
          <div class="main-label" id="mainLabel">
            Days
          </div>
        </div>

        <div class="details">

          <div class="detail">
            <div class="detail-number" id="weeks">—</div>
            <div class="detail-label">Weeks</div>
          </div>

          <div class="detail">
            <div class="detail-number" id="days">—</div>
            <div class="detail-label">Days</div>
          </div>

          <div class="detail">
            <div class="detail-number" id="months">—</div>
            <div class="detail-label">Months</div>
          </div>

          <div class="detail">
            <div class="detail-number" id="years">—</div>
            <div class="detail-label">Years</div>
          </div>

        </div>

        <div class="calendar-result" id="calendarResult">
          Choose a date to see the result.
        </div>

      </div>

      <div class="footer">
        Calculates calendar-based differences automatically
      </div>

    </section>
  </main>


  <script>
    const date1 = document.getElementById("date1");
    const date2 = document.getElementById("date2");

    const mainNumber = document.getElementById("mainNumber");
    const mainLabel = document.getElementById("mainLabel");
    const direction = document.getElementById("direction");

    const weeks = document.getElementById("weeks");
    const days = document.getElementById("days");
    const months = document.getElementById("months");
    const years = document.getElementById("years");

    const calendarResult = document.getElementById("calendarResult");
    const todayBtn = document.getElementById("todayBtn");


    // Format Date as YYYY-MM-DD
    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }


    // Convert input date safely to local Date
    function parseDate(value) {
      const [year, month, day] = value.split("-").map(Number);

      return new Date(year, month - 1, day);
    }


    // Number of days between two dates
    function totalDaysBetween(a, b) {
      const msPerDay = 24 * 60 * 60 * 1000;

      return Math.round(
        Math.abs(a.getTime() - b.getTime()) / msPerDay
      );
    }


    // Calculate calendar difference:
    // Years + Months + Days
    function calendarDifference(start, end) {

      let years = end.getFullYear() - start.getFullYear();
      let months = end.getMonth() - start.getMonth();
      let days = end.getDate() - start.getDate();

      if (days < 0) {
        months--;

        const previousMonth = new Date(
          end.getFullYear(),
          end.getMonth(),
          0
        );

        days += previousMonth.getDate();
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      return {
        years,
        months,
        days
      };
    }


    function calculate() {

      if (!date1.value || !date2.value) {
        direction.textContent = "Select a date to calculate";
        mainNumber.textContent = "—";
        mainLabel.textContent = "Days";

        weeks.textContent = "—";
        days.textContent = "—";
        months.textContent = "—";
        years.textContent = "—";

        calendarResult.textContent =
          "Choose a date to see the result.";

        return;
      }


      const first = parseDate(date1.value);
      const second = parseDate(date2.value);

      let earlier;
      let later;

      if (first < second) {
        earlier = first;
        later = second;

        direction.textContent =
          "📅 The selected date was in the past";
      }
      else if (first > second) {
        earlier = second;
        later = first;

        direction.textContent =
          "🚀 The selected date is in the future";
      }
      else {
        direction.textContent =
          "✨ Both dates are the same";

        mainNumber.textContent = "0";
        mainLabel.textContent = "Days";

        weeks.textContent = "0";
        days.textContent = "0";
        months.textContent = "0";
        years.textContent = "0";

        calendarResult.innerHTML =
          "<strong>Today!</strong> There is no difference between the dates.";

        return;
      }


      // Exact total days
      const totalDays = totalDaysBetween(first, second);

      // Weeks
      const totalWeeks = Math.floor(totalDays / 7);
      const remainingDays = totalDays % 7;

      // Calendar difference
      const calendar = calendarDifference(earlier, later);


      // Main result
      mainNumber.textContent = totalDays.toLocaleString();
      mainLabel.textContent =
        totalDays === 1 ? "Day" : "Days";


      // Details
      weeks.textContent = totalWeeks.toLocaleString();
      days.textContent = remainingDays;
      months.textContent =
        calendar.years * 12 + calendar.months;
      years.textContent = calendar.years;


      // Calendar-style result
      let resultText = "";

      if (calendar.years > 0) {
        resultText += `${calendar.years} ${
          calendar.years === 1 ? "year" : "years"
        } `;
      }

      if (calendar.months > 0) {
        resultText += `${calendar.months} ${
          calendar.months === 1 ? "month" : "months"
        } `;
      }

      if (calendar.days > 0) {
        resultText += `${calendar.days} ${
          calendar.days === 1 ? "day" : "days"
        }`;
      }

      resultText = resultText.trim();

      if (!resultText) {
        resultText = "Less than a month";
      }

      const prefix = first < second ? "" : "";

      calendarResult.innerHTML =
        `<strong>${resultText}</strong> apart`;
    }


    // Set reference date to today
    todayBtn.addEventListener("click", () => {

      const today = new Date();

      date2.value = formatDate(today);

      calculate();
    });


    // Calculate automatically when dates change
    date1.addEventListener("change", calculate);
    date2.addEventListener("change", calculate);


    // Initialize reference date as today
    const today = new Date();

    date2.value = formatDate(today);

  </script>

</body>
</html>
